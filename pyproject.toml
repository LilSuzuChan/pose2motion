[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pose2motion"
version = "0.1.0"
description = "Video pose extraction proof of concept"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mediapipe>=0.10.21,<0.11",
  "opencv-contrib-python>=4.11,<5",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
]

[project.scripts]
pose2motion = "pose2motion.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/pose2motion"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
